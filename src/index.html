<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>دونو — حمایت مالی از آفرینندگان محتوا</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="دونو، پلتفرم فارسی حمایت مالی از آفرینندگان محتوا، پادکست‌سازان، نویسندگان و هنرمندان مستقل با پرداخت آسان به تومان.">
  <meta property="og:title" content="دونو — حمایت مالی از آفرینندگان محتوا">
  <meta property="og:description" content="حمایت مالی مستقیم و ساده از آفرینندگان محتوای فارسی به تومان. ساخت صفحه رایگان در کمتر از دو دقیقه.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('dono_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
